name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: evaltest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eval" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
        env:
          EVALRUNNER_TEST_DSN: postgres://eval:eval@localhost:5432/evaltest?sslmode=disable
          EVALRUNNER_TEST_REDIS: localhost:6379
      - run: docker build -t go-eval-runner:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  k8s:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t go-eval-runner:dev .
          docker build -t evalrunner-web:dev web
      # Pinned kind install with checksum verification and download retries.
      # helm/kind-action failed once fetching the checksum file, which left no
      # cluster behind.
      - name: Install kind
        env:
          KIND_VERSION: v0.31.0
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version
      - name: Create cluster
        run: |
          kind create cluster --name evalrunner --wait 120s
          kubectl cluster-info
      - name: Load images into kind
        run: |
          kind load docker-image go-eval-runner:dev --name evalrunner
          kind load docker-image evalrunner-web:dev --name evalrunner
      - name: Deploy
        run: kubectl apply -f deploy/k8s/evalrunner.yaml
      - name: Smoke test through the cluster
        run: deploy/k8s/smoke.sh
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n evalrunner get pods -o wide
          kubectl -n evalrunner describe pods | tail -n 200
          kubectl -n evalrunner logs deploy/coordinator --tail=100 || true
          kubectl -n evalrunner logs deploy/apiserver --tail=100 || true
