global:
  scrape_interval: 5s

scrape_configs:
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:9090"]
  # Every worker replica, discovered through compose's DNS.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        refresh_interval: 5s
        type: A
        port: 9091
